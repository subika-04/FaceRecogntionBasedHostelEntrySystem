server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing (BrowserRouter) -- any path that
    # isn't a real static file must fall back to index.html, or a hard reload
    # on e.g. /students/42 will 404 instead of letting the SPA's router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets (Vite fingerprints filenames), but never
    # cache index.html itself so users always get the latest deployed build.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
